<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FAFE"/>
      <stop offset="1" stop-color="#E8F1FA"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677D2"/>
      <stop offset="1" stop-color="#4DA3F5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Deco dots -->
  <circle cx="1343" cy="83" r="13" fill="#D3E5F8"/>
  <circle cx="1416" cy="61" r="6" fill="#1677D2"/>
  <circle cx="1384" cy="112" r="4" fill="#1268B8"/>

  <!-- Download-arrow badge -->
  <rect x="90" y="190" width="120" height="120" rx="30" fill="#1677D2"/>
  <line x1="150" y1="218" x2="150" y2="266" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <polygon points="150,296 122,262 178,262" fill="#FFFFFF"/>
  <rect x="138" y="172" width="24" height="5" rx="2.5" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="252" y="252" font-family="Segoe UI" font-size="84" font-weight="bold" fill="#13324F">WDM</text>
  <text x="252" y="298" font-family="Segoe UI" font-size="26" font-weight="bold" fill="#2B4A6B">Windows Download Manager</text>
  <text x="252" y="338" font-family="Segoe UI" font-size="19" fill="#5A6B7B">Multi-threaded downloads with pause/resume, mirrors and link refresh.</text>

  <!-- Feature pills -->
  <g font-family="Segoe UI" font-size="16" font-weight="bold">
    <rect x="252" y="356" width="150" height="32" rx="16" fill="#E4F0FB"/>
    <text x="267" y="377" fill="#1677D2">Multi-threaded</text>
    <rect x="414" y="356" width="128" height="32" rx="16" fill="#E4F0FB"/>
    <text x="429" y="377" fill="#1677D2">Pause / Resume</text>
    <rect x="554" y="356" width="150" height="32" rx="16" fill="#E4F0FB"/>
    <text x="569" y="377" fill="#1677D2">Mirrors &amp; failover</text>
    <rect x="716" y="356" width="128" height="32" rx="16" fill="#E4F0FB"/>
    <text x="731" y="377" fill="#1677D2">Link refresh</text>
  </g>

  <!-- Mock download card -->
  <rect x="939" y="123" width="470" height="270" rx="20" fill="#FFFFFF" opacity="0.92" filter="drop-shadow(0 8px 16px rgba(21,53,90,0.11))"/>
  <rect x="935" y="115" width="470" height="270" rx="20" fill="#FFFFFF" stroke="#E1EAF4" stroke-width="1.5"/>

  <!-- File icon + name -->
  <rect x="965" y="141" width="34" height="40" rx="8" fill="#1677D2"/>
  <rect x="973" y="149" width="8" height="24" rx="2" fill="#FFFFFF"/>
  <rect x="983" y="149" width="8" height="24" rx="2" fill="#FFFFFF"/>
  <rect x="973" y="157" width="18" height="8" rx="2" fill="#FFFFFF"/>
  <text x="1013" y="170" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1F2E40">movie.mp4</text>
  <text x="1165" y="170" font-family="Segoe UI" font-size="17" fill="#7A8B9C">2.6 MB/s of 4.2 MB/s</text>

  <!-- Progress bar -->
  <rect x="965" y="223" width="410" height="16" rx="8" fill="#E7EFF8"/>
  <rect x="965" y="223" width="254" height="16" rx="8" fill="url(#bar)"/>
  <circle cx="1221" cy="231" r="14" fill="#FFFFFF" stroke="#1677D2" stroke-width="3"/>

  <!-- Percent + size -->
  <text x="965" y="285" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#1677D2">62%</text>
  <text x="1043" y="282" font-family="Segoe UI" font-size="16" fill="#7A8B9C">1.1 GB  /  1.8 GB   ·   ETA 00:04:12</text>

  <!-- Card pill row -->
  <g font-family="Segoe UI" font-size="16" font-weight="bold">
    <rect x="965" y="315" width="118" height="30" rx="15" fill="#E4F0FB"/>
    <text x="979" y="335" fill="#1677D2">3 threads</text>
    <rect x="1095" y="315" width="138" height="30" rx="15" fill="#E4F0FB"/>
    <text x="1109" y="335" fill="#1677D2">Mirror: 2 URLs</text>
  </g>
</svg>