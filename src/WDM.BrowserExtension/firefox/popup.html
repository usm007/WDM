<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WDM Download Catcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="" width="20" height="20" />
    <span>WDM Download Catcher</span>
  </div>

  <label class="switch-row">
    <span>
      <strong>Capture downloads</strong>
      <small>Send browser downloads to WDM</small>
    </span>
    <span class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </span>
  </label>

  <div class="status" id="status">Checking…</div>

  <div id="media-section" class="media-section" style="display: none;">
    <div class="media-header">
      <span>Detected Media</span>
      <span class="media-count" id="media-count">0</span>
    </div>
    <div id="media-list" class="media-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
