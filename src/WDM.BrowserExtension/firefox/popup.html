<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WDM Download Catcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="" width="20" height="20" />
    <span>WDM Download Catcher</span>
  </div>

  <label class="switch-row">
    <span>
      <strong>Capture downloads</strong>
      <small>Send browser downloads to WDM</small>
    </span>
    <span class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </span>
  </label>

  <div class="status" id="status">Checking…</div>

  <div class="media-section">
    <div class="media-header">
      <strong>This page's media</strong>
      <button id="refreshMedia" title="Refresh list">↻</button>
    </div>
    <div id="mediaList" class="media-list">
      <div class="empty">No media detected on this page yet.</div>
    </div>
    <button id="downloadAll" class="wide" disabled>Download all</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
